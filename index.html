<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <form class="weatherform">
    <input type="text" class="cityInput" placeholder="Enter city name">
    <button type="submit" class="submitBtn">Get Weather</button>
  </form>

  <div class="weatherInfo">
    <h2 class="cityName"></h2>
    <p class="temp"></p>
    <p class="humidity"></p>
    <p class="description"></p>
    <p class="weatherIcon"></p>
    <p class="error">Please enter a valid city name.</p>
  </div>

</body>
</html>
